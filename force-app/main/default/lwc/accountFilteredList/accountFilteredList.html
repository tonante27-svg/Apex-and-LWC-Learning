<template>
  <lightning-card
    icon-name="standard:account"
    title="Imperative Filtered Accounts"
    variant="base"
  >
    <lightning-button
      variant="brand"
      label="Get Accounts"
      slot="actions"
      onclick={handleSearch}
    ></lightning-button>
    <div class="slds-var-p-around_medium">
      <template if:true={error}>
        <p>Error accessing Accounts {error.body.message}</p>
      </template>
      <template
        lwc:if={accounts}
        for:each={accounts}
        for:item="account"
        for:index="index"
      >
        <div key={account.Id}>
          <p>{account.Name} {account.Industry} {account.Phone}</p>
          <hr />
        </div>
      </template>
    </div>
  </lightning-card>
</template>
