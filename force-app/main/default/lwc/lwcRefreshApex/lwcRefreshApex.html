<template>
  <lightning-card
    icon-name="standard:account"
    title="Latest 10 Accounts"
    variant="base"
  >
    <lightning-button
      variant="brand"
      label="Delete Account"
      slot="actions"
      onclick={deleteRecord}
    ></lightning-button>
    &nbsp;&nbsp;&nbsp;
    <lightning-button
      variant="brand"
      label="Update Account"
      slot="actions"
      onclick={updateRecord}
    ></lightning-button>

    <lightning-datatable
      key-field="Id"
      data={accountList}
      columns={cols}
      max-row-selection="1"
      onrowselection={handleSelection}
    ></lightning-datatable>
  </lightning-card>
</template>
