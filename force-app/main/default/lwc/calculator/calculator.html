<template>
    <lightning-card title="Calculator" icon-name="custom:custom63">
        <div class="slds-var-p-horizontal_medium">
            <lightning-input type="number" label="First Number" value={number1} onchange={handlerNumber1Change}></lightning-input>
            <lightning-input type="number" label="Second Number" value={number2} onchange={handlerNumber2Change}></lightning-input>
            <lightning-button label="Add" onclick={handleAddition}></lightning-button>
            <lightning-button label="Subtract" onclick={handleSubtract}></lightning-button>
            <p>Result: {result}</p>
        </div>
        </lightning-card>   
</template>
