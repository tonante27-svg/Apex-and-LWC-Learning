<template>
    <!--Example of Simple (Primitive Type) Data -->
    <c-p2c-alert-component
        message="Hurray!! I  got  the data"
        card-heading="Parent to Child primitive data communication"
        some-number=20
        is-valid="false">
    </c-p2c-alert-component>
    <!--Exampe of Complex (non-Primitive Type) Data -->
    <div class="slds-var-m-bottom_medium"></div>   
    <c-p2c-carousel-component carousel-details={carouselData}></c-p2c-carousel-component>
      <!--Exampe of Data  Passing on event/action -->
    <div class="slds-var-m-bottom_medium"></div> 
     <lightning-card title="Parent to Child communication on action" icon-name="utility:broadcast" variant="base">
        <div class="slds-var-m-around_medium">
            <lightning-input 
                type="number"
                label="Enter percentage"
                onkeyup={handleChange}
                value={percentage}
            ></lightning-input>
        
            <c-p2c-progress-component percentage-value={percentage}></c-p2c-progress-component>
        </div> 
   
    </lightning-card>
    <!--Calling Child Method from Parent using directive lwc:ref="child" -->
    <div class="slds-var-m-bottom_medium">
        <lightning-card variant="base">
            <div class="slds-var-m-around_medium">
                <lightning-button
                    label="Reset Slider"
                    variant="brand"
                    onclick={handleClick}>
                </lightning-button>
                <c-p2c-slider-component lwc:ref="child"></c-p2c-slider-component>
                <hr/>
            </div>
        </lightning-card>
        
    </div> 
   
    
</template>
