<template>
    <lightning-card title="SIGN UP: Render SignUp Page" icon-name="utility:page" variant="base">
       <div class="slds-var-p-horizontal_large sld-var-p-bottom_Large">
      <div class="sld-var-m-around_medium">
           <h2 class = "slds-text-heading_medium sld-var-m-bottom_medium">Sign-Up Form</h2>
            <lightning-input 
              type="text"
              label="First Name"
            ></lightning-input>
            <lightning-input 
              type="text"
              label="Last Name"
            ></lightning-input> 
           <lightning-input 
              type="email"
              label="Email Address"
            ></lightning-input>
             <lightning-input 
              type="password"
              label="Password"
            ></lightning-input><br/>
            <lightning-button 
              variant="destructive"
              label="Back" 
              title="Back" 
              onclick={handleClick} 
              class="slds-var-m-left_x-small"
            ></lightning-button>
             <lightning-button 
              variant="success"
              label="SignUp" 
              itle="SignUp" 
              onclick={submitHandler} 
              class="slds-var-m-left_x-small"
            ></lightning-button>
        </div>
        </div> 
    </lightning-card>
</template>
