<template>
   <lightning-card title="SIGN IN: Render Sign-In Page" icon-name="utility:page" variant="base">
    
  <div class="slds-var-p-horizontal_large sld-var-p-bottom_Large">
      <div class="sld-var-m-around_medium">
           <h2 class = "slds-text-heading_medium sld-var-m-bottom_medium">Sign-In Form</h2>
            <lightning-input 
              type="email"
              label="Email Address"
            ></lightning-input>
             <lightning-input 
              type="password"
              label="Password"
            ></lightning-input><br/>
            <lightning-button 
              variant="destructive"
              label="Back" 
              title="Back" 
              onclick={handleClick} 
              class="slds-var-m-left_x-small"
            ></lightning-button>
             <lightning-button 
              variant="success"
              label="SignIn" 
              itle="SignIn" 
              onclick={submitHandler} 
              class="slds-var-m-left_x-small"
            ></lightning-button>
        </div>
        </div>
    </lightning-card>
    
</template>
