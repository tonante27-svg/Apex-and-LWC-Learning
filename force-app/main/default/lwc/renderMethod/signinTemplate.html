<template>
    <lightning-card title="SIGNIN: Render Sign In Page" icon-name="utility:page" variant="base">
        <div class="sld-var-m-around_medium">
           <h2 class = "slds-text-heading_medium sld-var-m-bottom_medium">Sign-In Form</h2>
            <lightning-input 
              type="email"
              label="Email Address"
            ></lightning-input>
             <lightning-input 
              type="password"
              label="Password"
            ></lightning-input>
            <lightning-button 
              variant="destructive"
              label="Back" 
              title="Back" 
              onclick={handleClick} 
              class="slds-var-m-left_x-small"
            ></lightning-button>
             <lightning-button 
              variant="success"
              label="SignIn" 
              itle="SignIn" 
              onclick={submitHandler} 
              class="slds-var-m-left_x-small"
            ></lightning-button>
        </div>
    </lightning-card>
</template>
