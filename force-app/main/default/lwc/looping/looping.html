<template>
    <lightning-card  title="for:each Loop" icon-name="utility:apps">
        <div class="slds-var-m-around_medium">
           <ul class="slds-has-dividers_around-space">
                <template for:each={carList} for:item="car">
                    <div key={car}>
                    <li class="slds-item">{car}</li>
                    </div>
                </template>
            </ul>
        </div>
    </lightning-card>
    <lightning-card  title="for:each Loop with array of object" icon-name="utility:apps">
        <div class="slds-var-m-around_medium">
         <ul class="slds-has-dividers_around-space">
              <template for:each={ceoList} for:item="ceo">
                <div key={ceo.id}>
                   
                <li class="slds-item">
                     <strong>{ceo.company}</strong><br/> 
                     {ceo.name}
                 </li>
                    
                </div>
              </template>
            </ul>
        </div>
    </lightning-card>

     <lightning-card icon-name="utility:apps" title="iterator loop" variant="base">
       <div class="slds-var-m-around_medium">
              <ul  class="slds-has-dividers_around-space">
                   <template iterator:ceo={ceoList}>
                       <div key={ceo.value.id}>
                        <template lwc:if={ceo.first}>
                            <div class="slds-box slds-theme_shade"><strong>List of top companies and their CEOs</strong></div>
                        </template>
                        <li class="slds-item">
                            <strong>{ceo.value.company}</strong><br/> 
                            {ceo.value.name}
                        </li>
                        <template lwc:if={ceo.last}>
                            <div class="slds-box slds-theme_shade"><strong>End of List</strong></div>
                        </template>
                       </div>
                   </template>
            </ul>
        </div>
    </lightning-card>
