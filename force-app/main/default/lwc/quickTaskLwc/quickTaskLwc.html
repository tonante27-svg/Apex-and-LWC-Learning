<template>
    <lightning-card title ="Task Creator" icon-name="standard:task">    
        <div class="slds-var-p-around_large">
            <h1>Create task with Global Action</h1>
        </div>
        <div class="slds-var-p-horizontal_medium">
            <lightning-input label="Subject" onchange={handleSubject}></lightning-input>  
            <lightning-input label="Description" onchange={handleDescription}></lightning-input>  
        </div>
        <div></div><br/>
         <div class="slds-var-p-horizontal_medium">
            <lightning-button label="Cancel" variant="destructive" onclick={handleCancel}></lightning-button>  
             &nbsp;&nbsp;
             <lightning-button label="Save" variant="brand" onclick={handleSave}></lightning-button>  
        </div>
    </lightning-card>
</template>
