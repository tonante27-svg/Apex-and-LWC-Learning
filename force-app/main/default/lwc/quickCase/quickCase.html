<template>
  <lightning-card variant="Narrow" title="Quick Case" icon-name="standard:case">
    <div class="slds-var-p-horizontal_medium">
      <!--Subject-->
      <lightning-input type="text" label="Subject" name="Subject">
      </lightning-input>
      <lightning-textarea
        max-length="1000"
        name="Description"
        label="Description"
        variant="standard"
      ></lightning-textarea>
      <!--Contact Name-->
      <lightning-record-picker
        lwc:ref="recordPicker"
        label="Contact Name"
        placeholder="Search Contacts"
        object-api-name="Contact"
        onready={handleOnready}
      ></lightning-record-picker>

      <lightning-combobox
        name="Status"
        label="Status"
        placeholder="Select Status"
        options={statusOptions}
      ></lightning-combobox>

      <lightning-combobox
        name="Priority"
        label="Priority"
        placeholder="Select Priority"
        options={priorityOptions}
      ></lightning-combobox>
    </div>
  </lightning-card>
</template>
