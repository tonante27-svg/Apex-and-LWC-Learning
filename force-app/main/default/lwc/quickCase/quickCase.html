<template>
  <lightning-card variant="Narrow" title="Quick Case" icon-name="standard:case">
    <div class="slds-var-p-horizontal_medium">
      <!--Subject-->
      <lightning-input type="text" label="Subject" name="Subject">
      </lightning-input>
      <lightning-textarea
        max-length="1000"
        name="Description"
        label="Description"
        variant="standard"
      ></lightning-textarea>
      <!--Contact Name-->

      <lightning-combobox
        name="Status"
        label="Status"
        placeholder="Select Status"
        value={fields.Status}
        options={statusOptions}
        onchange={handleInput}
      ></lightning-combobox>

      <lightning-combobox
        name="Priority"
        label="Priority"
        placeholder="Select Priority"
        value={fields.Priority}
        options={priorityOptions}
        onchange={handleInput}
      ></lightning-combobox>

      <lightning-combobox
        name="Type"
        label="Type"
        placeholder="Select Type"
        value={fields.Type}
        options={typeOptions}
        onchange={handleInput}
      ></lightning-combobox>
    </div>
  </lightning-card>
</template>
