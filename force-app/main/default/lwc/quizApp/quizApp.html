<template>
    <lightning-card title="Quiz App Id LWC" icon-name="utility:answer" variant="base">
        <div class="slds-var-m-around_medium">
            
         <form>
         <template for:each={myQuestions} for:item="quiz">
            <div key ={quiz.id}>
               <div><strong>{quiz.id} - {quiz.question}</strong></div>
                <div class="slds-grid slds-var-p-bottom_medium">
                    <div class="slds-col">
                        <input type="radio" name={quiz.id} value="a" onchange={changeHandler}/>
                        {quiz.answers.a}
                    </div>
                    <div class="slds-col ">
                        <input type="radio" name={quiz.id} value="b" onchange={changeHandler}/>
                    {quiz.answers.b}
                    </div>
                    <div class="slds-col">
                        <input type="radio" name={quiz.id} value="c" onchange={changeHandler}/>
                        {quiz.answers.c}
                    </div>
                </div>
                
            </div>
        </template>
        <lightning-button
        type="button"
            label="Submit Quiz"
            variant="brand"
            disabled={allNotSelected}
            onclick={submitHandler}>
        </lightning-button>
        <!--<lightning-button 
            variant="brand"
            type="button"
            label="Submit" 
            title="Submit Quiz"
            onsubmit={submitHandler}
            disabled={allNotSelected}
            class="slds-var-m-around_small">
        </lightning-button>-->
        <lightning-button 
            variant="brand"
            title="Reset Quiz"
            type="reset"
            label="Reset" 
            onclick={resetHandler} 
            class="slds-var-m-around_small">
        </lightning-button>
        </form>
        <template lwc:if={isSubmitted}>
            <div class={isScoredFull}>
                <strong>
                    You have scored {correctAnswers} out of {myQuestions.length}
                </strong>
            </div>         
        </template>
         <template lwc:if={winnerScore}>
            <div class="slds-var-m-around_medium slds-text-heading_large slds-text-color_success"><strong>🎉 Congratulations You have gotten all  {myQuestions.length} answers correct!!💥</strong></div>   
         </template>
         <template lwc:if={isSubmitted}>
            <template lwc:if={isNotAllCorrect}>
                <div class="slds-var-m-around_medium slds-text-heading_large slds-text-color_error"><strong>😞 Sorry! Some answers are incorrect. Try Again !</strong></div>   
            </template>
         </template>
      </div>
    </lightning-card>
</template>
