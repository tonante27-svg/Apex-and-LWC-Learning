  <lightning-card
    title="LDS Load Record"
    variant="Narrow"
    icon-name="standard:account"
  >
    <!-- WITH LAYOUT TYPE-->
    <div class="slds-var-p-horizontal_medium">
      <lightning-record-form
        columns="2"
        layout-type="Compact"
        object-api-name={objectApiName}
        record-id={recordId}
        fields={fieldList}
        mode="edit"
        onsuccess={handleSuccess}
        onerror={handleError}
      ></lightning-record-form>
    </div>

    <!-- WITH CUSTOM FIELD LIST -->
    <hr />
    <span
      >lightning-record-View form example using fields attribute isntead of
      layout-type</span
    >
