<template>
  <lightning-card variant="Narrow">
    <div class="slds-var-p-around_large">
      <lightning-input
        type="text"
        variant="standard"
        name="Name"
        label="Opportuinty Name"
        placeholder="type here ..."
      ></lightning-input>
      <lightning-input
        type="text"
        variant="standard"
        name="StageName"
        label="Stage Name"
        placeholder="type here ..."
      ></lightning-input>
    </div>
    <div class="slds-var-p-around_large">
      <lightning-button
        variant="brand"
        label="Previous"
        title="Previous"
        icon-name="utility:chevronleft"
        icon-position="left"
        onclick={handlePrevious}
      ></lightning-button>
      &nbsp;&nbsp;
      <lightning-button
        variant="brand"
        label="Next"
        title="Next"
        icon-name="utility:chevronright"
        icon-position="right"
        onclick={handleNext}
      ></lightning-button>
    </div>
  </lightning-card>
