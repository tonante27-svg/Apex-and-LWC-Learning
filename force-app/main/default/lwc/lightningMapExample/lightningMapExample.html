<template>
  <lightning-card icon-name="standard:account" variant="base">
    <div class="slds-var-p-horizontal_small">
      <lightning-map
        if:true={mapMarkers}
        markers-title="Account Records"
        map-markers={mapMarkers}
        show-footer
        zoom-level="4"
        list-veiw={listView}
        onmarkerselect={handleMarkerSelect}
        selected-marker-value={selectedMarkerValue}
      ></lightning-map>
    </div>

    <div slot="footer">
      <lightning-badge label="Google Map"></lightning-badge>
    </div>
  </lightning-card>
</template>
